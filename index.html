
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneyy Finance</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #41d8a6;
    color: #263238;
}

header {
    background: #123c35;
    color: white;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    font-size: 24px;
}

header span {
    color: #8ee0bd;
}

.container {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px;
}

.welcome {
    margin-bottom: 100px;
}

.welcome h1 {
    font-size: 100px;
    margin-bottom: 8px;
}

.welcome p {
    color: #24d39e;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 3px 12px #00000008;
}

.card p {
    color: #788581;
    margin-bottom: 15px;
}

.card h2 {
    font-size: 25px;
}

.income {
    border-left: 5px solid #20b981;
}

.expense {
    border-left: 5px solid #ef6464;
}

.balance {
    border-left: 5px solid #4385e5;
}

.content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 3px 12px #00000008;
}

.panel h3 {
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input, select {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    width: 100%;
}

input:focus, select:focus {
    border-color: #20b981;
}

button {
    background: #123c35;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #1d594d;
}

.chart-container {
    height: 260px;
}

.history {
    margin-top: 25px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 14px 10px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

th {
    color: #788581;
}

.positive {
    color: #20b981;
    font-weight: bold;
}

.negative {
    color: #ef6464;
    font-weight: bold;
}

.delete {
    background: #ef6464;
    padding: 7px 10px;
    font-size: 12px;
}

.delete:hover {
    background: #d94343;
}

footer {
    text-align: center;
    padding: 25px;
    color: #788581;
    margin-top: 30px;
}

@media(max-width: 750px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .content {
        grid-template-columns: 1fr;
    }

    header {
        padding: 20px;
    }

    .container {
        margin-top: 25px;
    }

    .panel {
        overflow-x: auto;
    }

    table {
        min-width: 450px;
    }
}
</style>
</head>

<body>

<header>
    <h2>Moneyy <span>Finance.</span></h2>
    <p>banyak uang cuy</p>
</header>

<div class="container">

    <div class="welcome">
        <h1>My nigga</h1>
        <p>Kelola keuangan keluarga dengan lebih mudah.</p>
    </div>

    <div class="cards">
        <div class="card income">
            <p>Total Pemasukan</p>
            <h2 id="income">Rp 0</h2>
        </div>

        <div class="card expense">
            <p>Total Pengeluaran</p>
            <h2 id="expense">Rp 0</h2>
        </div>

        <div class="card balance">
            <p>Sisa Saldo</p>
            <h2 id="balance">Rp 0</h2>
        </div>
    </div>

    <div class="content">

        <div class="panel">
            <h3>Tambah Transaksi</h3>

            <form id="transactionForm">

                <input type="text" id="description"
                placeholder="Nama transaksi" required>

                <input type="number" id="amount"
                placeholder="Jumlah uang (Rp)"
                min="1" required>

                <select id="type">
                    <option value="income">monyet</option>
                    <option value="expense">Pengeluaran</option>
                </select>

                <select id="category">
                    <option value="Gaji">Gaji</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Transportasi">Transportasi</option>
                    <option value="Tagihan">Tagihan</option>
                    <option value="Pendidikan">Pendidikan</option>
                    <option value="Tabungan">Tabungan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>

                <input type="date" id="date" required>

                <button type="submit">+ Tambah Transaksi</button>

            </form>
        </div>

        <div class="panel">
            <h3>Grafik Keuangan</h3>
            <div class="chart-container">
                <canvas id="financeChart"></canvas>
            </div>
        </div>

    </div>

    <div class="panel history">
        <h3>Riwayat Transaksi</h3>

        <select id="filter" style="max-width:200px">
            <option value="all">Semua Transaksi</option>
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
        </select>

        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Transaksi</th>
                    <th>Kategori</th>
                    <th>Jumlah</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="transactionList"></tbody>
        </table>
    </div>

</div>

<footer>
    © 2026 Family Finance | Kelola Keuangan Keluarga
</footer>

<script>

let transactions = JSON.parse(
    localStorage.getItem("familyTransactions")
) || [];

const form = document.getElementById("transactionForm");

const rupiah = number => new Intl.NumberFormat(
    "id-ID",
    {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }
).format(number);

document.getElementById("date").value =
    new Date().toISOString().slice(0, 10);

form.addEventListener("submit", function(e) {

    e.preventDefault();

    const transaction = {
        id: Date.now(),
        description: document.getElementById("description").value,
        amount: Number(document.getElementById("amount").value),
        type: document.getElementById("type").value,
        category: document.getElementById("category").value,
        date: document.getElementById("date").value
    };

    transactions.push(transaction);

    saveData();
    form.reset();

    document.getElementById("date").value =
        new Date().toISOString().slice(0, 10);

});

function saveData() {
    localStorage.setItem(
        "familyTransactions",
        JSON.stringify(transactions)
    );

    render();
}

function render() {

    let income = 0;
    let expense = 0;

    transactions.forEach(item => {
        if (item.type === "income") {
            income += item.amount;
        } else {
            expense += item.amount;
        }
    });

    document.getElementById("income").textContent =
        rupiah(income);

    document.getElementById("expense").textContent =
        rupiah(expense);

    document.getElementById("balance").textContent =
        rupiah(income - expense);

    const filter = document.getElementById("filter").value;

    const filtered = transactions
        .filter(item => filter === "all" || item.type === filter)
        .sort((a, b) => b.date.localeCompare(a.date));

    const list = document.getElementById("transactionList");

    list.innerHTML = "";

    filtered.forEach(item => {

        const row = document.createElement("tr");

        const values = [
            item.date,
            item.description,
            item.category,
            (item.type === "income" ? "+" : "-") +
                rupiah(item.amount)
        ];

        values.forEach((value, index) => {
            const cell = document.createElement("td");
            cell.textContent = value;

            if (index === 3) {
                cell.className = item.type === "income"
                    ? "positive" : "negative";
            }

            row.appendChild(cell);
        });

        const action = document.createElement("td");
        const deleteButton = document.createElement("button");

        deleteButton.textContent = "Hapus";
        deleteButton.className = "delete";

        deleteButton.onclick = () => {
            transactions = transactions.filter(
                t => t.id !== item.id
            );
            saveData();
        };

        action.appendChild(deleteButton);
        row.appendChild(action);
        list.appendChild(row);

    });

    updateChart(income, expense);
}

let chart;

function updateChart(income, expense) {

    const ctx = document.getElementById("financeChart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "doughnut",

        data: {
            labels: ["Pemasukan", "Pengeluaran"],

            datasets: [{
                data: [income, expense],
                backgroundColor: ["#20b981", "#ef6464"],
                borderWidth: 0
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: "bottom"
                }
            }
        }
    });

}

document.getElementById("filter").addEventListener(
    "change", render
);

render();

</script>

</body>
</html>
